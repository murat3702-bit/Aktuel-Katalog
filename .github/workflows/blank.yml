name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Sadece Gradle derlemesi yerine test edilmemiş debug APK üreten komutla güncelledik
    - name: Build Debug APK
      run: gradle assembleDebug

    # Üretilen APK dosyasını GitHub paneline indirme bağlantısı olarak yükler
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
